AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MAXBALL EDTECH production stack (issue #35). One free-plan sized EC2
  instance runs Docker Compose: Caddy (automatic HTTPS on an sslip.io name),
  the application image from GHCR and PostgreSQL. Continuous deployment is
  pull-based: a systemd timer on the instance deploys every commit on main
  whose image CI has published, so GitHub holds no AWS credentials (the AWS
  free plan denies IAM OIDC providers). No SSH port is open. A monthly AWS
  Budget e-mails the owner before credits burn.

Parameters:
  GitHubRepository:
    Type: String
    Default: maksatworkspace-sudo/studylist
    Description: owner/name of the public repository whose main branch is deployed.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
    Description: Free-plan eligible instance types only.
  RootVolumeGiB:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 30
    Description: Free tier covers up to 30 GiB of gp3.
  BudgetEmail:
    Type: String
    Description: E-mail that receives AWS Budget cost alerts.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Alert threshold for the monthly cost (paid from free credits).
  EnableSessionManager:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Attach an IAM role for SSM Session Manager shell access (needs IAM role creation rights).
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  SessionManager: !Equals [!Ref EnableSessionManager, "true"]

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Condition: SessionManager
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: SessionManager
    Properties:
      Roles: [!Ref InstanceRole]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MAXBALL web traffic only (HTTP for ACME + redirect, HTTPS). No SSH.
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !If [SessionManager, !Ref InstanceProfile, !Ref AWS::NoValue]
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      CreditSpecification:
        CPUCredits: standard
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-app" }
        - { Key: Project, Value: maxball }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          # Also on the serial console: EC2 → Instance → Monitor → Get system log.
          exec > >(tee -a /var/log/maxball-bootstrap.log /dev/console) 2>&1
          dnf install -y docker git jq
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          # The small instance needs swap headroom for PostgreSQL + Node.
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          swapon -a || true
          mkdir -p /opt/maxball
          cd /opt/maxball
          # Secrets are generated on the instance and never leave it: tracing
          # is off here so they do not reach the log or the serial console.
          set +x
          if [ ! -f .env ]; then
            umask 077
            {
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
              echo "APP_SECRET=$(openssl rand -hex 32)"
              echo "APP_SECRET_ROTATED=1"
              echo "GITHUB_REPOSITORY=${GitHubRepository}"
            } > .env
          fi
          set -x
          for f in deploy.sh autodeploy.sh; do
            curl -fsSL "https://raw.githubusercontent.com/${GitHubRepository}/main/deploy/aws/$f" -o "$f"
            chmod 700 "$f"
          done
          # Give the Elastic IP association a moment before Caddy requests a certificate.
          sleep 30
          ./deploy.sh latest || echo "first deploy failed; the timer retries"
          # Pull-based CD: every minute, deploy main's newest published image.
          cat > /etc/systemd/system/maxball-autodeploy.service <<'UNIT'
          [Unit]
          Description=Deploy the newest MAXBALL commit published by CI
          After=docker.service network-online.target
          [Service]
          Type=oneshot
          ExecStart=/opt/maxball/autodeploy.sh
          UNIT
          cat > /etc/systemd/system/maxball-autodeploy.timer <<'UNIT'
          [Unit]
          Description=Check for a new MAXBALL release every minute
          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now maxball-autodeploy.timer

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - { Key: Project, Value: maxball }

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

Outputs:
  AppUrl:
    Description: Public HTTPS URL (Caddy + Let's Encrypt on sslip.io). Set as the AWS_APP_URL repository variable.
    Value: !Sub
      - "https://${Dashed}.sslip.io"
      - Dashed: !Join ["-", !Split [".", !Ref ElasticIP]]
  InstanceId:
    Description: The EC2 instance running the stack.
    Value: !Ref Instance
  Region:
    Description: Region of the stack.
    Value: !Ref AWS::Region
