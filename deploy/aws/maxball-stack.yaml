AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  MAXBALL EDTECH production stack (issue #35). One free-plan sized EC2
  instance runs Docker Compose: Caddy (automatic HTTPS on an sslip.io name),
  the application image from GHCR and PostgreSQL. No SSH: operations and CI
  deploys go through SSM, and GitHub Actions assumes a narrowly scoped role
  through OIDC. A monthly AWS Budget e-mails the owner before credits burn.

Parameters:
  GitHubRepository:
    Type: String
    Default: maksatworkspace-sudo/studylist
    Description: owner/name of the repository allowed to deploy.
  GitHubEnvironment:
    Type: String
    Default: aws
    Description: GitHub Actions environment name used by the deploy job.
  CreateGitHubOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
    Description: Free-plan eligible instance types only.
  RootVolumeGiB:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 30
    Description: Free tier covers up to 30 GiB of gp3.
  BudgetEmail:
    Type: String
    Description: E-mail that receives AWS Budget cost alerts.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Alert threshold for the monthly cost (paid from free credits).
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  CreateOIDC: !Equals [!Ref CreateGitHubOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MAXBALL web traffic only (HTTP for ACME + redirect, HTTPS). No SSH.
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      CreditSpecification:
        CPUCredits: standard
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-app" }
        - { Key: Project, Value: maxball }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/maxball-bootstrap.log) 2>&1
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.39.4/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          # The small instance needs swap headroom for PostgreSQL + Node.
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          swapon -a || true
          mkdir -p /opt/maxball
          cd /opt/maxball
          # Secrets are generated on the instance and never leave it.
          if [ ! -f .env ]; then
            umask 077
            {
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
              echo "APP_SECRET=$(openssl rand -hex 32)"
              echo "GITHUB_REPOSITORY=${GitHubRepository}"
            } > .env
          fi
          curl -fsSL "https://raw.githubusercontent.com/${GitHubRepository}/main/deploy/aws/deploy.sh" -o deploy.sh
          chmod 700 deploy.sh
          # Give the Elastic IP association a moment before Caddy requests a certificate.
          sleep 30
          ./deploy.sh latest

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags:
        - { Key: Project, Value: maxball }

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions (OIDC) to redeploy this one instance through SSM.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDC
                - !Ref GitHubOIDCProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: redeploy-one-instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

Outputs:
  AppUrl:
    Description: Public HTTPS URL (Caddy + Let's Encrypt on sslip.io). Set as the AWS_APP_URL repository variable.
    Value: !Sub
      - "https://${Dashed}.sslip.io"
      - Dashed: !Join ["-", !Split [".", !Ref ElasticIP]]
  InstanceId:
    Description: Set as the AWS_INSTANCE_ID repository variable.
    Value: !Ref Instance
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN repository variable.
    Value: !GetAtt DeployRole.Arn
  Region:
    Description: Set as the AWS_REGION repository variable.
    Value: !Ref AWS::Region
