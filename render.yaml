# Render Blueprint (#34): the docker-compose.yml stack mapped service by
# service, as Render does not run compose files itself:
#   compose "app" -> web service from the GHCR image built by CI
#   compose "db"  -> Render Postgres (DATABASE_URL over the private network)
# Free plans only. This is the DEVELOPMENT environment: CI redeploys each
# green commit on main through the deploy hook with the commit's image tag
# (.github/workflows/ci.yml, deploy-development). Production runs on AWS and
# only changes through the manual promotion workflow (promote.yml).
services:
  - type: web
    name: maxball
    runtime: image
    image:
      url: ghcr.io/kulynym/inf316:latest
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: MAXBALL_ADAPTER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: maxball-db
          property: connectionString
      - key: MAXBALL_DEMO
        value: "1"
      - key: APP_SECRET
        generateValue: true
      - key: APP_ENV
        value: development
      # Optional: send telemetry to the production collector (Caddy /otlp,
      # see _docs/observability.md). Left empty, telemetry stays off.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      # APP_URL falls back to Render's RENDER_EXTERNAL_URL (Dockerfile CMD).

databases:
  - name: maxball-db
    plan: free
    region: frankfurt
    databaseName: maxball
    user: maxball
    postgresMajorVersion: "16"
