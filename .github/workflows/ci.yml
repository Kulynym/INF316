# CI/CD (#33): every push and pull request runs the backend/frontend unit
# and contract suites on memory, SQLite and PostgreSQL, the isolated browser
# runner, the Docker Compose stack with HTTP integration + Playwright
# end-to-end tests (one spec per feature, issues labelled e2e-test), and the
# observability stack (OpenTelemetry -> Prometheus/Loki/Jaeger/Grafana,
# alert -> AI on-call agent).
# Every green commit on main publishes the images to GHCR and deploys the
# DEVELOPMENT environment (Render). PRODUCTION (AWS) changes only through
# the manual "Promote to production" workflow (promote.yml). A deploy job is
# skipped until its repository variables exist.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read


jobs:
  unit:
    name: Unit, contract and database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maxball
          POSTGRES_PASSWORD: maxball
          POSTGRES_DB: maxball_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maxball -d maxball_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit + contract tests (memory repository)
        run: npm test
      - name: Store/domain/jobs suites on SQLite
        run: npm run test:sqlite
      - name: Store/domain/jobs suites on PostgreSQL
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://maxball:maxball@localhost:5432/maxball_test
      - name: Frontend production build
        run: npm run build
      - name: On-call agent typecheck and tests (fake Anthropic/GitHub APIs)
        working-directory: oncall
        run: npm ci && npm run typecheck && npm test
      - name: Alert rules check and unit tests (promtool)
        run: |
          docker run --rm -v "$PWD/deploy/observability:/rules" -w /rules --entrypoint promtool \
            prom/prometheus:v3.15.1 check rules alerts.yml
          docker run --rm -v "$PWD/deploy/observability:/rules" -w /rules --entrypoint promtool \
            prom/prometheus:v3.15.1 test rules alerts.test.yml
      - name: Collector and Alertmanager configs are valid
        run: |
          docker run --rm -v "$PWD/deploy/observability/otel-collector.yaml:/c.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.163.2 validate --config=/c.yaml
          docker run --rm -v "$PWD/deploy/observability/alertmanager.yml:/a.yml:ro" --entrypoint amtool \
            prom/alertmanager:v0.34.2 check-config /a.yml
      - name: Dashboard JSON matches its generator
        run: |
          python3 deploy/observability/grafana/build-dashboard.py
          git diff --exit-code deploy/observability/grafana/dashboards

  browser:
    name: Isolated browser runner (SQLite + mock mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Isolated strict verification (http + browser + sqlite restart)
        run: node scripts/verify.mts --strict
      - name: Isolated mock-mode browser verification (#5 zero API traffic)
        run: node scripts/verify.mts --phase e2e --mode mock --strict
      - name: Upload verification artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: verify-artifacts
          if-no-files-found: ignore
          path: |
            test-results/
            playwright-report/

  stack:
    name: Integration + E2E on Docker Compose (app + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_PORT: "3000"
      APP_VERSION: ${{ github.sha }}
      MAXBALL_IMAGE: maxball-ci:${{ github.sha }}
      MAXBALL_RATE_LIMIT_SCALE: "50"
      # Production mode checks Origin against APP_URL: use the test origin.
      APP_URL: http://127.0.0.1:3000
      TEST_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Build the single application image
        run: docker compose build
      - name: Start the stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 180
      - name: Health check reports PostgreSQL
        run: |
          curl -fsS "$TEST_URL/api/health" | tee health.json
          grep -q '"adapter":"postgres"' health.json
      - run: npm ci
      - name: HTTP integration tests against the stack
        run: npx vitest run tests/http.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Playwright end-to-end tests (all features)
        run: npm run e2e
      - name: Data survives an application restart
        run: |
          before=$(docker compose exec -T db psql -U maxball -d maxball -tAc "select count(*) from feedback")
          docker compose restart app
          docker compose up -d --wait --wait-timeout 120
          after=$(docker compose exec -T db psql -U maxball -d maxball -tAc "select count(*) from feedback")
          echo "feedback rows before=$before after=$after"
          test "$before" = "$after"
          curl -fsS "$TEST_URL/api/health"
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          retention-days: 7
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
      - name: Tear down
        if: always()
        run: docker compose down -v

  observability:
    name: Observability (OpenTelemetry, dashboard, alert -> AI on-call)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_PORT: "3000"
      APP_VERSION: ${{ github.sha }}
      APP_URL: http://127.0.0.1:3000
      TEST_URL: http://127.0.0.1:3000
      MAXBALL_IMAGE: maxball-ci:${{ github.sha }}
      ONCALL_IMAGE: maxball-oncall-ci:${{ github.sha }}
      MAXBALL_RATE_LIMIT_SCALE: "50"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      ONCALL_COOLDOWN_MINUTES: "1"
      # When the repository has this secret the agent investigates with
      # Claude; without it the agent files its raw-evidence report.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Start app, database and the observability stack
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build -d --wait --wait-timeout 300
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate traffic (feature specs)
        run: >-
          npx playwright test --project=desktop-1280x720
          e2e/features/01-public-feed.spec.ts e2e/features/02-guest-submission.spec.ts
          e2e/features/05-accounts-login.spec.ts e2e/features/09-comments.spec.ts
          e2e/features/10-support-bookmarks.spec.ts e2e/features/14-moderation.spec.ts
      - name: Change a metric - 25 failed logins (MaxballLoginFailureSpike)
        run: |
          for i in $(seq 1 25); do
            curl -s -o /dev/null -w "%{http_code} " -X POST "$TEST_URL/api/actions" \
              -H "Origin: $TEST_URL" -H "Content-Type: application/json" \
              -d "{\"action\":\"login\",\"email\":\"guess$i@example.com\",\"password\":\"wrong-password\"}"
          done
      - name: Verify metrics, logs, traces, dashboard, alert and on-call report
        run: node scripts/verify-observability.mjs
      - name: On-call report in the job summary
        if: always()
        run: test -f oncall-report.md && cat oncall-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml down -v

  publish:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, browser, stack, observability]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      # Image names must be lowercase; the repository is Kulynym/INF316.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: oncall
          push: true
          tags: |
            ${{ env.IMAGE }}-oncall:latest
            ${{ env.IMAGE }}-oncall:${{ github.sha }}

  deploy-development:
    name: Deploy to development (Render)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_APP_URL != ''
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: development
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      - name: Deploy this commit's image through the deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          image=$(jq -rn --arg v "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" '$v|@uri')
          curl -fsS -X POST "${HOOK}&imgURL=${image}" -o /dev/null -w "deploy hook HTTP %{http_code}\n"
      - name: Smoke test the deployed version
        env:
          APP: ${{ vars.RENDER_APP_URL }}
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS "$APP/api/health" || true)
            echo "$body"
            if echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\""; then exit 0; fi
            sleep 15
          done
          echo "Render did not report version ${GITHUB_SHA}" >&2
          exit 1
